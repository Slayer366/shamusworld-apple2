#
# Apple 2 configuration file
#

# Apple ROM paths
#Not used anymore
#BIOSROM = ./ROMs/apple2e-enhanced.rom
#BIOSROM = ./ROMs/apple2e.rom
#diskROM = ./ROMs/disk.rom
#ROMs = ./ROMs

# Defaults
disks = ./disks/

# Speed up the emulator while a floppy disk is being read or written
enhancedDiskSpeed = 1

# Hard disk images (HDV, 2MG/2IMG, PO).  Only harddrive1 is emulated at the moment.
harddrive1 = 
harddrive2 = 

# Auto state loading/saving upon starting/quitting Apple2 (1-use, 0-don't use)
# These are the defaults--we don't advertise it just yet... ;-)

autoSaveState = 0
autoStateFilename = ./apple2auto.state

# OpenGL filtering type: 1 - blurry, 0 - sharp

glFilterType = 0

# Display options: 1 - fullscreen, 0 - windowed

fullscreen = 0

# Apple II speaker volume (0-100 percent; default: 75)
speakerVolume = 75

# Mockingboard volume (0-1000 percent, max 200 recommended; default: 100)
mockingboardVolume = 150

# Joystick options: 1 - use joystick, 0 - don't use

useJoystick = 0

# Joyport option: If joystick is enabled above, set the port (0 - 3) here

joyport = 0

windowX = 315
windowY = 213

hardwareTypeNTSC = 1
renderType = 0
useOpenGL = 1

# card# refers to a daughterboard and '= #' sets the desired slot in the Apple IIe
# card1 is the 1st Disk II controller and should be in slot 6 (card1 = 6)
# card2 is the 2nd Disk II controller and can be installed in slot 4 (remove Mockingboard first) (card2 = 4, card3 = 0)
# card3 is the 1st Mockingboard and should be in Slot 4 (card3 = 4)
# card4 is the 2nd Mockingboard and can be installed in slot 5 (card4 = 5)
# card5 is the SCSI Hard Drive card and can be installed in slot 7 (card5 = 7)

card1 = 6
card2 = 0
card3 = 4
card4 = 0
card5 = 0
